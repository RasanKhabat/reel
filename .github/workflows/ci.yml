name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15   # Apple silicon; its Xcode provides swiftc for the panel
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: cargo test
      - name: Lint
        run: cargo clippy --release -- -D warnings
      - name: Build app
        run: ./build.sh
