[package]
name = "reel"
version = "0.4.0"
edition = "2021"
description = "A scrolling window manager for macOS"
license = "MIT"
publish = false

[[bin]]
name = "Reel"
path = "src/main.rs"

[dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
block2 = "0.6"
core-foundation = "0.10"
core-graphics = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
